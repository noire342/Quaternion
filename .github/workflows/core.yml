name: Quaternion build

# Explicit builds only. Pushes do not publish releases or prune tags.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VECTOR_BUILD_REPOSITORY: ${{ github.repository }}
      VECTOR_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Check translations and build Debug
        run: |
          python3 manager/tools/check_translations.py manager/src/main/res
          python3 manager/tools/check_translations.py daemon/src/main/res
          ./gradlew :zygisk:zipDebug --no-daemon --max-workers=4
      - uses: actions/upload-artifact@v7
        with:
          name: Quaternion-Debug
          path: zygisk/release/Quaternion-*-Debug.zip
          if-no-files-found: error
